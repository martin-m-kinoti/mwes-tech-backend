# One row per Firebase user. The primary key IS the Firebase UID.
type User @table(name: "users", key: "id") {
  id: String!                                   # Firebase UID
  email: String
  createdAt: Timestamp! @default(expr: "request.time")
}

enum OrderStatus {
  PENDING
  IN_PROGRESS
  COMPLETED
}

type Order @table(name: "orders") {
  user: User!                                   # owner (no @default here)
  userEmail: String @default(expr: "auth.token.email")
  service: String!
  deliveryDuration: String!
  deliveryDate: Timestamp!
  comments: String! @col(dataType: "text") @default(value: "")
  status: OrderStatus! @default(value: PENDING)
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

enum PaymentStatus {
  PENDING
  SUCCESS
  FAILED
}

type Payment @table(name: "payments") {
  user: User!                                   # owner (Firebase UID)
  checkoutRequestId: String!                    # Daraja STK checkout id
  merchantRequestId: String
  serviceId: String!                            # Order id this payment is for
  phone: String!
  amount: Float!
  status: PaymentStatus! @default(value: PENDING)
  mpesaReceipt: String
  amountPaid: Float
  transactionDate: String                       # M-Pesa yyyyMMddHHmmss
  payerPhone: String
  failReason: String
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

# Append-only STK push lifecycle log, rendered as a timeline in the UI.
type PaymentEvent @table(name: "payment_events") {
  payment: Payment!
  eventCode: String!                            # initiated | prompt_sent | success | cancelled | timeout | failed
  message: String!
  createdAt: Timestamp! @default(expr: "request.time")
}